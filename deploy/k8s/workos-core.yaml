apiVersion: v1
kind: Namespace
metadata:
  name: workos-ai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workos-config
  namespace: workos-ai
data:
  ENVIRONMENT: production
  LOG_LEVEL: info
  TASK_TIMEOUT: "5m"

---
apiVersion: v1
kind: Secret
metadata:
  name: workos-secrets
  namespace: workos-ai
type: Opaque
stringData:
  DB_PASSWORD: changeme
  RABBITMQ_PASSWORD: changeme
  OPENAI_API_KEY: sk-changeme

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: workos-ai
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: workos-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: workos-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg15-latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: workos
        - name: POSTGRES_DB
          value: workos_ai
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workos-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
# RabbitMQ Service
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: workos-ai
spec:
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  selector:
    app: rabbitmq

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: workos-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: workos-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: guest
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: workos-secrets
              key: RABBITMQ_PASSWORD
        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: rabbitmq-storage
        persistentVolumeClaim:
          claimName: rabbitmq-pvc

---
# Orchestrator Service
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: workos-ai
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: 50051
    name: grpc
  selector:
    app: orchestrator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: workos-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: workos/orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: ORCHESTRATOR_PORT
          value: "50051"
        - name: DB_HOST
          value: postgres
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        envFrom:
        - configMapRef:
            name: workos-config
        - secretRef:
            name: workos-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:50051"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:50051"]
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Executive Agent Service
apiVersion: v1
kind: Service
metadata:
  name: executive-agent
  namespace: workos-ai
spec:
  type: ClusterIP
  ports:
  - port: 50052
    targetPort: 50052
    name: grpc
  selector:
    app: executive-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executive-agent
  namespace: workos-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: executive-agent
  template:
    metadata:
      labels:
        app: executive-agent
    spec:
      containers:
      - name: executive-agent
        image: workos/executive-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50052
          name: grpc
        env:
        - name: EXECUTIVE_AGENT_PORT
          value: "50052"
        - name: DB_HOST
          value: postgres
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        - name: ORCHESTRATOR_HOST
          value: orchestrator
        - name: ORCHESTRATOR_PORT
          value: "50051"
        envFrom:
        - configMapRef:
            name: workos-config
        - secretRef:
            name: workos-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# HPA for Orchestrator
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
  namespace: workos-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# NetworkPolicy to restrict traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workos-network-policy
  namespace: workos-ai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: workos-ai
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: workos-ai
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
