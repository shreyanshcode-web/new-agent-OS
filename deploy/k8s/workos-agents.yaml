---
# HR Agent Service
apiVersion: v1
kind: Service
metadata:
  name: hr-agent
  namespace: workos-ai
spec:
  type: ClusterIP
  ports:
  - port: 50053
    targetPort: 50053
    name: grpc
  selector:
    app: hr-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-agent
  namespace: workos-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-agent
  template:
    metadata:
      labels:
        app: hr-agent
    spec:
      containers:
      - name: hr-agent
        image: workos/hr-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50053
          name: grpc
        env:
        - name: HR_AGENT_PORT
          value: "50053"
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        - name: ORCHESTRATOR_HOST
          value: orchestrator
        - name: ORCHESTRATOR_PORT
          value: "50051"
        envFrom:
        - configMapRef:
            name: workos-config
        - secretRef:
            name: workos-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

